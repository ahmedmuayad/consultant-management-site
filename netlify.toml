[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The site moved to GitHub Pages (free, no credit limits). Netlify only forwards visitors there,
# so old links, QR codes and PDFs keep working.
[[redirects]]
  from = "/*"
  to = "https://ahmedmuayad.github.io/consultant-management-site/:splat"
  status = 301
  force = true
